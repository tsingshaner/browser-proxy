version: 2.1
jobs:
  build:
    docker:
      - image: cimg/node:24.11.0
    steps:
      - checkout
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm release:legacy
      - store_artifacts:
          path: dist
workflows:
  build:
    jobs:
      - build
